<!DOCTYPE html>
<html lang="es" ng-app="TiendaApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda DAW</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/icon2.png">

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body ng-controller="MainController">

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand fs-4 fw-bold">Mi Tienda</span>
        <i class="bi bi-cart3 text-white fs-4"></i>
    </nav>

    <div id="heroSlider" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="img/slider1.jpg" class="d-block w-100 img-slider">
            </div>

            <div class="carousel-item">
                <img src="img/slider2.jpg" class="d-block w-100 img-slider">
            </div>

            <div class="carousel-item">
                <img src="img/slider3.jpg" class="d-block w-100 img-slider">
            </div>

        </div>
        
        <button class="carousel-control-prev" type="button" data-bs-target="#heroSlider" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#heroSlider" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <div class="container mt-5">
        <div class="input-group mb-5">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" 
                   class="form-control" 
                   placeholder="Busca por nombre, descripción o categoría..."
                   ng-model="busquedaTexto"> </div>
    </div>
    <div class="container mt-5" ng-controller="CategoriasController">
        <h3 class="mb-3">Categorías</h3>

        <button class="btn btn-outline-primary btn-sm me-2 mb-2"
                ng-repeat="cat in categorias"
                ng-click="seleccionarCategoria(cat)">
            {{ cat }}
        </button>
    </div>

    <div class="container mt-5"
        ng-controller="ProductosCategoriaController"
        ng-show="productosPorCategoria.length > 0">

        <h2 class="text-center mb-4">
            Productos en: {{ $parent.categoriaSeleccionada }}
        </h2>

        <div class="row justify-content-center">

            <div class="col-md-4 mb-4" 
                ng-repeat="prod in productosPorCategoria | filter: { title: $parent.busquedaTexto }"> 
                <div class="card h-100 shadow-sm card-producto">
                    <img ng-src="{{ prod.image }}" class="card-img-top img-card" alt="producto">

                    <div class="card-body">
                        <h5 class="card-title">{{ prod.title }}</h5>
                        <p class="text-success fw-bold">$ {{ prod.price }}</p>

                        <button class="btn btn-primary w-100"
                                data-bs-toggle="modal" data-bs-target="#productoModal">
                            Detalles
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </div>
    
    <div class="container mt-5" ng-controller="ProductosCtrl" ng-if="!categoriaSeleccionada">
        <h2 class="text-center mb-4">Catálogo Completo</h2>

        <div class="row justify-content-center">

            <div class="col-md-4 mb-4" ng-repeat="item in productos | filter: { title: busquedaTexto }">
                <div class="card h-100 shadow-sm card-producto">
                    <img ng-src="{{ item.image }}" class="card-img-top img-card" alt="producto">

                    <div class="card-body">
                        <h5 class="card-title">{{ item.title }}</h5>
                        <p class="text-success fw-bold">$ {{ item.price }}</p>

                        <button class="btn btn-primary w-100"
                            data-bs-toggle="modal" data-bs-target="#productoModal">
                            Detalles
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="productoModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalles del producto</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p>Contenido visual del modal.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/app.js"></script>
    <script src="js/controllers/categoriasController.js"></script>
    <script src="js/controllers/productosCategoriaController.js"></script>

</body>

</html>
